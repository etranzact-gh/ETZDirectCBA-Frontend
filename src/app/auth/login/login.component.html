
<section class="w-full min-h-screen flex flex-col md:flex-row lg:flex-row inter-uniquifier">

    <!-- LEFT SIDE -->
    <div class="bg-[#0C1427] w-full lg:w-[40%] relative overflow-hidden">

        <!-- Logo -->
        <div class="p-6 md:p-8 flex">
            <span class="text-white font-bold text-[20px]">Direct</span>
            <span class="text-[#F20000] font-bold text-[20px]">CBA</span>
        </div>

        <!-- Text Content -->
        <div class="flex flex-col px-6 md:px-10 mt-10 lg:mt-24">

            <span class="text-white font-bold text-[28px] md:text-[36px] leading-tight">
                Bank Integration <br />
                Configuration Portal
            </span>

            <span class="text-white/50 font-medium text-[14px] md:text-[16px] mt-4 leading-relaxed">
                Manage wallet-to-bank and bank-to-wallet endpoints,
                token authentication, and fee structures for all connected
                financial institutions
            </span>

        </div>

        <!-- Tags -->
        <div class="flex items-center gap-3 px-6 md:px-10 mt-10">

            <div class="border border-[#2563EB]/30 w-12 md:w-16 h-[1px]"></div>

            <div class="flex gap-2 md:gap-3 items-center text-[12px] md:text-[14px]">

                <div class="text-white/50">SECURE</div>

                <div class="h-[4px] w-[4px] rounded-full bg-white/50"></div>

                <div class="text-white/50">RELIABLE</div>

                <div class="h-[4px] w-[4px] rounded-full bg-white/50"></div>

                <div class="text-white/50">FAST</div>

            </div>

        </div>

        <!-- Icons -->
        <div class="grid grid-cols-3 md:grid-cols-5 gap-6 px-6 md:px-10 mt-12 pb-10">

            <img src="cbapar.svg" alt="">
            <img src="cbasecure.svg" alt="">
            <img src="cbashield.svg" alt="">
            <img src="cbascale.svg" alt="">
            <img src="cbadll.svg" alt="">

        </div>

        <!-- Blur Layer -->
        <div class="absolute bottom-0 right-0 opacity-70 hidden md:block">
            <img src="blurlayer.svg" alt="">
        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="bg-[#F8FAFC] w-full lg:w-[60%] flex items-center justify-center px-6 py-12">

        <div class="w-full max-w-md">

            <!-- Heading -->
            <div class="flex flex-col text-center gap-1 mb-8">

                <span class="font-semibold text-black text-[28px]">
                    Welcome Back!
                </span>

                <span class="text-black/50 font-normal text-[14px] md:text-[15px]">
                    Sign in to manage bank configurations
                </span>

            </div>

            <!-- Form -->
            <form #signinForm="ngForm" class="w-full space-y-4" nz-form>

                <!-- Username -->
                <nz-form-item class="flex flex-col">
                
                    <label class="mb-1 text-[13px] md:text-[14px]">
                        Username
                    </label>
                
                    <input nz-input type="email" [(ngModel)]="signinData.username" name="username" required placeholder="Enter username" class="border border-[#D7D7D7] text-[#7C7C7C]
                                        p-3 rounded-[8px] h-[45px] w-full" />
                
                </nz-form-item>

                <!-- Password -->
                <nz-form-item class="flex flex-col">
                
                    <label class="mb-1 text-[13px] md:text-[14px]">
                        Password
                    </label>
                
                    <input type="password" nz-input required name="password" [(ngModel)]="signinData.password" placeholder="Enter password" class="border border-[#D7D7D7] text-[#7C7C7C]
                                        p-3 rounded-[8px] h-[45px] w-full" />
                </nz-form-item>
                <!-- Button -->
                <div class="pt-3">
                    <button *ngIf="!loading" (click)="onSubmit(signinForm)" type="submit" class="w-full bg-[#163993] text-white rounded-[8px] h-[45px]
                     text-[14px] md:text-[16px] font-medium flex items-center justify-center">Sign In
                </button>
                    <nz-spin *ngIf="loading" nzSimple class="spinner m-auto ml-[160px] md:ml-[210px] lg:ml-[210px]"></nz-spin>
                
                </div>
                
                </form>

        </div>

    </div>

</section>
